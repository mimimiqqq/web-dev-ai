<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>background</title>
    <link rel="stylesheet" href="./05-background.css" />
  </head>
  <body>
    <h1>배경</h1>
    <h2>background-color</h2>
    <div class="box bg-color"></div>
    <h2>background-image</h2>
    <div class="box pic"></div>
    <h2>background-repeat:no-repeat + position:center</h2>
    <div class="box pic bg-norepeat"></div>
    <h2>background-size:cover</h2>
    <div class="box pic bg-cover"></div>
    <h2>background-attachment:fiexd</h2>
    <div class="box pic bg-fixed"></div>
    <h2>gradient</h2>
    <div class="box bg-gradient"></div>
    <h2>사진 + 투명 검정</h2>
    <div class="box bg-overlay"></div>
    <h2>blend-mode 색이랑 사진 섞어줌</h2>
    <div class="box bg-blend"></div>
    <h2>background 축약형(함축형임- 컬러 이미지 리펫 포지션 /사이즈순)</h2>
    <div class="box bg"></div>
  </body>
</html>
