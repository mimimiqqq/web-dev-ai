<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>div와 span</title>
    <style>
        div,
        span{

            border: 1px solid;
        }
    </style>


</head>
  
    <h2>Div와 Span</h2>
    <!-- 아무런 의미가 없는 태그들. 단지영역, 묶을때 사용 -->
     <p>div는 block요소라 한줄을 차지하고, (크게 차지) <br/>
    span은 inline요소라 내용만큼만 차지한다.(단어만큼만 차지)
    </p>
     <!-- div*3 -->
    <div>1번째 div</div>
    <div>2번째 div</div>
    <div>3번째 div</div>


<!-- span{$번째 span}*3 -->

<span>1번째 span</span>
<span>2번째 span</span>
<span>3번째 span</span>

<h3>영역 지정</h3>
<div>div는 사각형 박스로 영역이 잡힌다.<br>
    줄이 바뀌면 다음줄로 내려간다

</div>

<span>span은 문장안의 일부처럼 표시 된다. <br>
줄~바~꿈~ 없~이~ 이~어~진~다.</span>





  </body>
</html>
