<!-- <태그>
  속성="값" 내용</태그> -->
<!--현재 문서가 HTML5언어로 작성된 웹문서-->
<!doctype html>
<html><!--웹문서의 시작과 끝-->
    <head>
        <!--웹문서의 정보-->
        <title>문서제목</title>
        <meta charset="utf-8">
        <meta name="description" content="문서 설명을 여기에 작성합니다">
        <meta name="author" content="문서작성자">
        <!-- 모바일 화면설정
            -width=device-width : 화면 너비에 맞춤 
            -initial-scale=1.0 : 초기 확대 비율
            -viewport-fit=cover : 노치(상단 카메라/센서)까지 화면사용-->


<!-- Open Graph공유카드 : 카카오톡 등 링크 공유할때 미리 보기 -->
        <meta name="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <meta property="og.title" content="문서제목">
        <meta property="og.description" content="문서 설명을 여기에 작성합니다">
        <meta property="og.image" content="페이지화면이미지">
        <meta property="og.url" content="현재페이지 URL주소">

        <!-- 파비콘설정 : .ico, .png, .svg 파일 -->
        <link rel="icon" href="favicon.png">
    

        

   
   
    </head>


    <body>
            <!--실제 웹브라우저에 나타나는 내용-->

                안녕하세요 오늘 26년 9월 7일입니다.
                익숙해요ㅏㅏㅏㅏ~
    </body>
</html>
