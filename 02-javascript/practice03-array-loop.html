        1부터 20까지의 합을 구하시오.
        <script>
          //렛 i 는 최초 시작값이고, i++는 계속 플러스를 하겠다는 뜻이고,
          //  i<=20은 거기까지가 니가 더할 숫자의 연속끝지점이다

          // let sum = 0;
          //for (let i = 1; i <= 20; i++) {

          //sum = sum + i; // sum = 1, i = 1
          //console.log("sum : " + sum);
          //sum += i; // sum = sum + i
          //console.log("------------------");
          //}
          let num = 0;
          for (let i = 1; i <= 20; i++) {
            num += i;
            /*num은 0자리부터야.
            +=는 계속더하는거야.
            i는 1부터 20까지야. */
          }
          console.log(num);
        </script>

      <li>
        주어진 배열의 모든 요소를 for문으로 순회하며 합계를 구하시오.
        <script>
          const prices = [5500, 3000, 12000, 8000];
          // 여기에 코드 작성

          //  console.log(prices[0]);
          //  console.log(prices[1]);
          //  console.log(prices[2]);
          //  console.log(prices[3]);
          console.log(prices);
          let total = 0; /*보통 합계시작할때 무 부터 시작하려고.*/
          for (
            let i = 0 /*[5500...]배열이 있어서 0번째부터 시작한다는뜻*/;
            i <= 3 /* 8000은 3번째ㅔ자리.조리법같은것 .break */;
            i++ /*더할거야*/
          ) {
            console.log(`i : ${i}, prices[i] : ${prices[i]}`);
            total += prices[i];
            console.log(`total : ${total}`);
            console.log("---------------------");
          }
          console.log(total);
        </script>
