<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <title>해시계</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Noto+Serif+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
    <style>
      :root {
        --bg: #e7e2d3;
        --surface: #dcd6c2;
        --surface-line: rgba(33, 28, 18, 0.14);
        --text: #211c13;
        --text-dim: #6d6450;
        --accent: #9c6e17;
        --accent-strong: #7c5710;
        --accent2: #45735f;
        --track: rgba(33, 28, 18, 0.16);
        --shadow: rgba(33, 28, 18, 0.1);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #10132a;
          --surface: #191d3b;
          --surface-line: rgba(237, 230, 211, 0.1);
          --text: #ece5d2;
          --text-dim: #9994a8;
          --accent: #dbaa55;
          --accent-strong: #f0c374;
          --accent2: #7fac98;
          --track: rgba(237, 230, 211, 0.14);
          --shadow: rgba(0, 0, 0, 0.35);
        }
      }

      :root[data-theme="dark"] {
        --bg: #10132a;
        --surface: #191d3b;
        --surface-line: rgba(237, 230, 211, 0.1);
        --text: #ece5d2;
        --text-dim: #9994a8;
        --accent: #dbaa55;
        --accent-strong: #f0c374;
        --accent2: #7fac98;
        --track: rgba(237, 230, 211, 0.14);
        --shadow: rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2.5rem 1.25rem;
        font-family: "Noto Serif KR", serif;
        transition: background 0.4s ease;
      }

      *:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .stage {
        width: 100%;
        max-width: 34rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.1rem;
      }

      .panel {
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--surface-line);
        border-radius: 4px;
        padding: 2.4rem clamp(1.4rem, 5vw, 3rem) 2.1rem;
        box-shadow: 0 1.5rem 3rem -1.5rem var(--shadow);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 0.6rem;
        font-family: "Song Myung", "Noto Serif KR", serif;
        font-size: 0.92rem;
        letter-spacing: 0.14em;
        color: var(--accent);
      }

      .date-line {
        margin: 0 0 1.6rem;
        font-size: clamp(1.05rem, 3vw, 1.3rem);
        font-weight: 600;
        color: var(--text);
      }

      .date-line .weekday {
        color: var(--accent2);
        font-weight: 700;
      }

      .date-line .nums {
        font-family: "IBM Plex Mono", monospace;
        font-variant-numeric: tabular-nums;
      }

      .clock {
        font-family: "IBM Plex Mono", monospace;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        font-size: clamp(3rem, 13vw, 5.4rem);
        line-height: 1;
        letter-spacing: 0.01em;
        color: var(--text);
      }

      .clock-labels {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        width: min(100%, 19rem);
        margin-top: 0.55rem;
        font-family: "Song Myung", serif;
        font-size: 0.85rem;
        letter-spacing: 0.3em;
        color: var(--text-dim);
      }

      .divider {
        width: 100%;
        height: 1px;
        background: var(--surface-line);
        margin: 2rem 0 1.7rem;
      }

      .year-section {
        width: 100%;
      }

      .year-section h2 {
        margin: 0 0 1.1rem;
        font-family: "Song Myung", serif;
        font-weight: 400;
        font-size: 1.35rem;
        letter-spacing: 0.04em;
        color: var(--text);
      }

      .arc-wrap {
        position: relative;
        width: 100%;
        max-width: 26rem;
        margin: 0 auto;
      }

      .arc-svg {
        width: 100%;
        height: auto;
        display: block;
        overflow: visible;
      }

      .arc-track {
        fill: none;
        stroke: var(--track);
        stroke-width: 3;
        stroke-linecap: round;
      }

      .arc-elapsed {
        fill: none;
        stroke: var(--accent);
        stroke-width: 3;
        stroke-linecap: round;
      }

      .arc-marker {
        fill: var(--accent-strong);
        stroke: var(--surface);
        stroke-width: 3;
        transition:
          cx 0.9s linear,
          cy 0.9s linear;
      }

      @media (prefers-reduced-motion: reduce) {
        .arc-marker {
          transition: none;
        }
      }

      .arc-label {
        font-family: "Noto Serif KR", serif;
        font-size: 11px;
        fill: var(--text-dim);
      }

      .arc-center-label {
        position: absolute;
        left: 50%;
        top: 58%;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: baseline;
        gap: 0.3rem;
        font-family: "IBM Plex Mono", monospace;
      }

      .arc-center-label span {
        font-size: 1.9rem;
        font-weight: 600;
        color: var(--text);
        font-variant-numeric: tabular-nums;
      }

      .arc-center-label small {
        font-family: "Noto Serif KR", serif;
        font-size: 0.85rem;
        color: var(--text-dim);
      }

      .countdown {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.6rem;
        margin: 1.4rem 0 0.9rem;
      }

      .cd-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.2rem;
        padding: 0.65rem 0.2rem 0.55rem;
        border-top: 1px solid var(--surface-line);
      }

      .cd-num {
        font-family: "IBM Plex Mono", monospace;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        font-size: clamp(1.25rem, 5vw, 1.7rem);
        color: var(--text);
      }

      .cd-unit {
        font-family: "Song Myung", serif;
        font-size: 0.78rem;
        color: var(--text-dim);
        letter-spacing: 0.05em;
      }

      .progress-caption {
        margin: 0;
        font-size: 0.85rem;
        color: var(--text-dim);
      }

      .progress-caption span {
        font-family: "IBM Plex Mono", monospace;
        color: var(--accent2);
        font-variant-numeric: tabular-nums;
      }

      .footnote {
        margin: 0;
        font-size: 0.78rem;
        color: var(--text-dim);
        letter-spacing: 0.02em;
      }
    </style>

    <main class="stage">
      <div class="panel">
        <p class="eyebrow">오늘의 시각 · 로컬 기준</p>
        <p class="date-line">
          <span class="nums" id="dateStr">2026년 09월 22일</span>
          <span class="weekday" id="weekday">화요일</span>
        </p>

        <div class="clock" id="clockStr" aria-live="polite">00:00:00</div>
        <div class="clock-labels">
          <span>시</span><span>분</span><span>초</span>
        </div>

        <div class="divider" aria-hidden="true"></div>

        <section class="year-section">
          <h2>올해 남은 시간</h2>

          <div class="arc-wrap">
            <svg class="arc-svg" viewBox="0 0 320 175" aria-hidden="true">
              <path
                class="arc-track"
                d="M 40 145 A 120 120 0 0 1 280 145"
              ></path>
              <path
                class="arc-elapsed"
                id="arcElapsed"
                d="M 40 145 A 120 120 0 0 1 40 145"
              ></path>
              <circle
                class="arc-marker"
                id="arcMarker"
                r="6"
                cx="40"
                cy="145"
              ></circle>
              <text class="arc-label" x="18" y="168">1월 1일</text>
              <text class="arc-label" x="302" y="168" text-anchor="end">
                12월 31일
              </text>
            </svg>
            <div class="arc-center-label">
              <span id="dayOfYear">1</span><small>일째</small>
            </div>
          </div>

          <div class="countdown">
            <div class="cd-item">
              <span class="cd-num" id="cdDays">00</span
              ><span class="cd-unit">일</span>
            </div>
            <div class="cd-item">
              <span class="cd-num" id="cdHours">00</span
              ><span class="cd-unit">시간</span>
            </div>
            <div class="cd-item">
              <span class="cd-num" id="cdMins">00</span
              ><span class="cd-unit">분</span>
            </div>
            <div class="cd-item">
              <span class="cd-num" id="cdSecs">00</span
              ><span class="cd-unit">초</span>
            </div>
          </div>

          <p class="progress-caption">
            올해 <span id="pctElapsed">0.0</span>% 경과
          </p>
        </section>
      </div>

      <p class="footnote">매 초 자동으로 갱신됩니다.</p>
    </main>

    <script>
      const WEEKDAYS = [
        "일요일",
        "월요일",
        "화요일",
        "수요일",
        "목요일",
        "금요일",
        "토요일",
      ];
      const pad = (n, len = 2) => String(n).padStart(len, "0");

      const dateStrEl = document.getElementById("dateStr");
      const weekdayEl = document.getElementById("weekday");
      const clockEl = document.getElementById("clockStr");
      const arcElapsedEl = document.getElementById("arcElapsed");
      const arcMarkerEl = document.getElementById("arcMarker");
      const dayOfYearEl = document.getElementById("dayOfYear");
      const cdDaysEl = document.getElementById("cdDays");
      const cdHoursEl = document.getElementById("cdHours");
      const cdMinsEl = document.getElementById("cdMins");
      const cdSecsEl = document.getElementById("cdSecs");
      const pctEl = document.getElementById("pctElapsed");

      const CX = 160,
        CY = 145,
        R = 120;

      function arcPoint(frac) {
        const theta = Math.PI * (1 - frac);
        return {
          x: CX + R * Math.cos(theta),
          y: CY - R * Math.sin(theta),
        };
      }

      function tick() {
        const now = new Date();

        dateStrEl.textContent = `${now.getFullYear()}년 ${pad(now.getMonth() + 1)}월 ${pad(now.getDate())}일`;
        weekdayEl.textContent = WEEKDAYS[now.getDay()];
        clockEl.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

        const year = now.getFullYear();
        const yearStart = new Date(year, 0, 1, 0, 0, 0, 0);
        const yearEnd = new Date(year + 1, 0, 1, 0, 0, 0, 0);
        const yearMs = yearEnd - yearStart;
        const elapsedMs = now - yearStart;
        const frac = Math.min(1, Math.max(0, elapsedMs / yearMs));

        const dayOfYear = Math.floor(elapsedMs / 86400000) + 1;
        dayOfYearEl.textContent = dayOfYear;
        pctEl.textContent = (frac * 100).toFixed(1);

        const p = arcPoint(frac);
        const largeArc = frac > 0.5 ? 1 : 0;
        arcElapsedEl.setAttribute(
          "d",
          `M 40 145 A ${R} ${R} 0 ${largeArc} 1 ${p.x.toFixed(2)} ${p.y.toFixed(2)}`,
        );
        arcMarkerEl.setAttribute("cx", p.x.toFixed(2));
        arcMarkerEl.setAttribute("cy", p.y.toFixed(2));

        let remainMs = yearEnd - now;
        if (remainMs < 0) remainMs = 0;
        const remainDays = Math.floor(remainMs / 86400000);
        const remainHours = Math.floor((remainMs % 86400000) / 3600000);
        const remainMins = Math.floor((remainMs % 3600000) / 60000);
        const remainSecs = Math.floor((remainMs % 60000) / 1000);

        cdDaysEl.textContent = pad(remainDays, 3);
        cdHoursEl.textContent = pad(remainHours);
        cdMinsEl.textContent = pad(remainMins);
        cdSecsEl.textContent = pad(remainSecs);
      }

      function scheduleTick() {
        const now = new Date();
        const delay = 1000 - now.getMilliseconds();
        setTimeout(() => {
          tick();
          setInterval(tick, 1000);
        }, delay);
      }

      tick();
      scheduleTick();
    </script>
  </body>
</html>
